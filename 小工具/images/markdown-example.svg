<svg xmlns="http://www.w3.org/2000/svg" width="600" height="160" viewBox="0 0 600 160" role="img" aria-labelledby="title desc">
  <title id="title">Markdown 图片示例</title>
  <desc id="desc">蓝色背景上的 Markdown 字样和井号图标</desc>
  <rect width="600" height="160" rx="16" fill="#2f81f7"/>
  <rect x="30" y="30" width="100" height="100" rx="12" fill="#ffffff" opacity="0.16"/>
  <text x="80" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="72" font-weight="700" fill="#ffffff">#</text>
  <text x="160" y="98" font-family="Arial, sans-serif" font-size="46" font-weight="700" fill="#ffffff">Markdown</text>
  <text x="163" y="125" font-family="Arial, sans-serif" font-size="18" fill="#dbeafe">图片语法显示示例</text>
</svg>
